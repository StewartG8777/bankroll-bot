name: Bankroll validation

on:
  push:
    branches:
      - main
      - upgrade/storage-recovery-performance
  pull_request:
    branches:
      - main

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check index.js
          for file in systems/*.js; do node --check "$file"; done
      - name: Check package metadata
        run: node -e "const p=require('./package.json'); if (!p.scripts || !p.scripts.start) process.exit(1)"
