name: Bankroll Node tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax check application and modules
        run: |
          node --check index.js
          find systems test -type f -name '*.js' -print0 | xargs -0 -n 1 node --check
      - name: Run all unit tests
        run: npm test
